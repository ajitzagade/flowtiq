# ios-unsigned.yml
#
# Flowtiq Mobile — iOS Unsigned Build
# ====================================
# Trigger: GitHub Actions → Actions tab → "iOS Unsigned Build" → Run workflow
#
# No Apple Developer account or certificates required.
# Output: FlowtiqMobile-unsigned-<run_number>.ipa (artifact, kept 7 days)
#
# Install the IPA on a device via:
#   - Sideloadly  (sideloadly.io)  — free, needs Apple ID
#   - AltStore    (altstore.io)    — free, needs Apple ID
#   - Apple Configurator 2         — supervised devices only
#
# NOTE: Because ios/FlowtiqMobile.xcodeproj and native source files (AppDelegate
#       etc.) are not committed to git, this workflow regenerates them from the
#       React Native 0.73.6 template on every run and overlays the committed
#       custom files (Info.plist, entitlements, sound).
#       To skip regeneration in future runs, commit the generated
#       ios/FlowtiqMobile.xcodeproj and ios/FlowtiqMobile/AppDelegate.* files.

name: iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  ios-unsigned:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ─────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate iOS native project from RN template (if not committed) ────
      # Produces: ios/FlowtiqMobile.xcodeproj + AppDelegate.mm + main.m etc.
      # Then overlays our committed Info.plist / entitlements / sound file.
      - name: Generate iOS native project
        working-directory: apps/mobile
        run: |
          if [ -d "ios/FlowtiqMobile.xcodeproj" ]; then
            echo "FlowtiqMobile.xcodeproj already present — skipping generation"
            exit 0
          fi

          echo "Generating iOS native project from RN 0.73.6 template..."

          # Back up committed custom files before generation
          cp ios/FlowtiqMobile/Info.plist              /tmp/Info.plist.bak
          cp ios/FlowtiqMobile/FlowtiqMobile.entitlements /tmp/entitlements.bak
          cp ios/FlowtiqMobile/flowtiq_sound.mp3       /tmp/flowtiq_sound.mp3.bak

          # Generate a fresh RN project (--skip-install skips npm/yarn install)
          # Use --pm npm to avoid pnpm workspace resolution issues during init
          npx --yes react-native@0.73.6 init FlowtiqMobile \
            --version 0.73.6 \
            --skip-install \
            --pm npm \
            --directory _tmp_rn

          # Copy the Xcode project and native source files into our ios/ dir
          cp -r _tmp_rn/ios/FlowtiqMobile.xcodeproj ios/
          cp -r _tmp_rn/ios/FlowtiqMobileTests       ios/ 2>/dev/null || true

          # Native source files (AppDelegate, main.m, LaunchScreen, xcassets etc.)
          # Copy only items not already present so we don't clobber committed ones
          for f in _tmp_rn/ios/FlowtiqMobile/*; do
            fname="$(basename "$f")"
            if [ ! -e "ios/FlowtiqMobile/$fname" ]; then
              cp -r "$f" "ios/FlowtiqMobile/$fname"
            fi
          done

          # Restore our committed custom files (they take priority over template)
          cp /tmp/Info.plist.bak              ios/FlowtiqMobile/Info.plist
          cp /tmp/entitlements.bak            ios/FlowtiqMobile/FlowtiqMobile.entitlements
          cp /tmp/flowtiq_sound.mp3.bak       ios/FlowtiqMobile/flowtiq_sound.mp3

          # Patch the bundle identifier generated by the template.
          # RN 0.73 may generate com.flowtiqmobile, org.reactjs.native.example.FlowtiqMobile,
          # or similar — replace whatever PRODUCT_BUNDLE_IDENTIFIER value was set.
          sed -i '' \
            's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.flowtiq.mobile;/g' \
            ios/FlowtiqMobile.xcodeproj/project.pbxproj

          rm -rf _tmp_rn

          echo "iOS native project generated successfully"

      # ── Link transitive pnpm deps needed by Podfile ─────────────────────────
      # pnpm only hoists direct deps into apps/mobile/node_modules/.
      # @react-native-community/cli-platform-ios is a transitive dep (dep of
      # react-native), so it lives only in the root .pnpm virtual store.
      # We find it there with `find` and symlink it into mobile's node_modules.
      - name: Link cli-platform-ios for CocoaPods
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          PKG="@react-native-community/cli-platform-ios"
          PKG_PATH=$(find "$REPO_ROOT/node_modules/.pnpm" -type d -name "cli-platform-ios" 2>/dev/null \
            | grep "react-native-community" | head -1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: $PKG not found in pnpm virtual store"
            exit 1
          fi
          mkdir -p "$REPO_ROOT/apps/mobile/node_modules/@react-native-community"
          ln -sfn "$PKG_PATH" "$REPO_ROOT/apps/mobile/node_modules/$PKG"
          echo "Linked $PKG -> $PKG_PATH"

      # ── Ruby / Bundler / fastlane ────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/ios

      # ── CocoaPods ───────────────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      # ── Build unsigned IPA via fastlane ─────────────────────────────────────
      - name: Build unsigned IPA
        working-directory: apps/mobile/ios
        run: bundle exec fastlane build_unsigned
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlowtiqMobile-unsigned-${{ github.run_number }}
          path: apps/mobile/ios/build/FlowtiqMobile-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
